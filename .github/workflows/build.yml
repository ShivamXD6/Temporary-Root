name: Build

on:
  push:
    branches: [master, main]
    tags: ['v*']
  pull_request:
    branches: [master, main]
  workflow_dispatch:

jobs:
  build-lkms:
    name: LKMs / ${{ matrix.kmi }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        kmi:
          - android12-5.10
          - android13-5.10
          - android13-5.15
          - android14-5.15
          - android14-6.1
          - android15-6.6
          - android16-6.12
          - android17-6.18
    container:
      image: ghcr.io/ylarod/ddk-min:${{ matrix.kmi }}-20260828
      options: --privileged
    steps:
      - uses: actions/checkout@v7

      - name: Build temproot.ko
        run: |
          cd lkm
          make -j$(nproc)
          llvm-objcopy --strip-unneeded \
            -R .comment -R .note.gnu.build-id -R .note.gnu.property \
            -R .note.Linux -R .note.GNU-stack \
            -R .BTF -R .BTF.base -R .llvm_addrsig \
            -R .hyp.text -R .hyp.bss -R .hyp.rodata -R .hyp.event_ids \
            -R .hyp.patchable_function_entries -R .hyp.data temproot.ko
          mkdir -p $GITHUB_WORKSPACE/out
          cp temproot.ko $GITHUB_WORKSPACE/out/temproot-${{ matrix.kmi }}.ko
          make clean

      - name: Upload temproot.ko
        uses: actions/upload-artifact@v7
        with:
          name: temproot-lkm-${{ matrix.kmi }}
          path: out/temproot-${{ matrix.kmi }}.ko

  build-temproot:
    needs: build-lkms
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Download Temporary Root LKMs
        uses: actions/download-artifact@v7
        with:
          pattern: temproot-lkm-*
          merge-multiple: true
          path: app/src/main/jni/ko/

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v6

      - name: Build Temporary Root APK
        run: ./gradlew :app:assembleDebug

      - name: Upload Temporary Root APK
        uses: actions/upload-artifact@v7
        with:
          name: TemporaryRoot
          path: app/build/outputs/apk/debug/*.apk
